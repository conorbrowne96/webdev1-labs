<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Car Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="container">
    <header>
      <h1>Book a Car</h1>
    </header>
    <main>
      <section id="form">
        <h2>Contact Us</h2>

        <form action="process.html" method="get" id="booking">
          <div class="form-row">
            <label for="contactname">Name</label>
            <input autofocus required="text" name="contactname" id="contactname" pattern= "[A-Z][a-z]+([A-Z][a-z]+)?" title="Please enter your name with a Capital letter first">
            
          </div>

          <div class="form-row">
            <label for="email">Email Address: </label>
            <input type="email" name="email" id="email" required pattern = "[a-z0-9._%+-]+@[a-z0-9.-]+.[a-z]{2,}$" title="Please enter your email address">
          </div>

          <div class="form-row">
            <label for="licence">Do you have a driver's licence </label>
            <label for="yes">
              <input type="radio" name="format" id="text" value="yes" checked="checked"> Yes</label>
            <label for="no">
              <input type="radio" name="format" id="html" value="no"> No</label>
          </div>

          <div class="form-row">
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="17" max="80" step="1" required title="Please enter your age">
          </div>

          <div class="form-row">
            <label for="booking_date">Booking date</label>
            <input type="date" name="booking_date" id="booking_date" required title="Pick a date">
          </div>

          <div class="form-row">
            <label for="car">Car</label>
            <select name="car" id="car">
              <option value="win32">Ford Focus</option>
              <option value="mac">Hyundai Tucson</option>
              <option value="linux">Toyota Rav4</option>
              <option value="linux">Renault Kadjar</option>
              <option value="linux">Nissan Qashqai</option>
            </select>
          </div>

          <div class="form-row">
            <label for="comments">
              Please provide any other details you think will be useful to us in the text area below
                (it may save us calling or emailing you, and help avoid delays).
          
                More details (as much as you think we'll need!)
              </label>
            <textarea name="comments" id="comments"></textarea>
          </div>

<button type ="submit">Send us the info</button>
<button type ="reset">Clear the info</button>




        </form>
      </section>
      <section id="image">
        <figure>
          <img src="images/car.jfif" alt="Car" class="ui fluid image">
          <figcaption>Car Rental</figcaption>
        </figure>
      </section>
    </main>
  </div>
</body>

</html>
